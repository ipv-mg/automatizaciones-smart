name: Ensure main protection and CODEOWNERS

on:
  workflow_dispatch:
  push:
    paths:
      - .github/CODEOWNERS
      - .github/workflows/ensure-main-protection.yml

jobs:
  protect-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate CODEOWNERS file
        run: |
          if [ ! -f .github/CODEOWNERS ]; then
            echo "ERROR: .github/CODEOWNERS no existe." >&2
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*\*\s+@[^[:space:]]+' .github/CODEOWNERS; then
            echo "ERROR: .github/CODEOWNERS no tiene un patrón válido. Debe ser algo como: '* @owner1 @owner2'" >&2
            exit 1
          fi
          echo "CODEOWNERS file is present and has a valid catch-all owner line."

      - name: Apply branch protection to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            await github.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              required_status_checks: null,
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                required_approving_review_count: 1,
                dismissal_restrictions: {
                  users: [],
                  teams: []
                }
              },
              restrictions: null
            });

            console.log(`Branch protection applied to ${owner}/${repo}@${branch}`);
